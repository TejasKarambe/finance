spring.application.name=finance

# Dynamic Port Binding for Cloud Hosting (Render / Heroku / Railway)
server.port=${PORT:8080}

# Neon PostgreSQL Connection Configuration with Cloud Environment Overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-ancient-tree-b5mk1twi-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_ot9XsIP7JhgK}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=NeonHikariCP

# Hibernate & JPA Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Data Web
spring.data.web.pageable.page-serialization-mode=via-dto

